providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[phases.install]
cmds = ["python -m venv /opt/venv && . /opt/venv/bin/activate && pip install --require-hashes -r requirements/backend.txt"]

[start]
cmd = "python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*"
